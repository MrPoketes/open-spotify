name: Release

on:
  push:
    tags: ["v*"]
  # Builds the same installers without publishing, to test the workflow.
  workflow_dispatch:

jobs:
  installers:
    name: installers (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm package --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      # electron-builder names the installers after package.json's version, so a
      # mismatched tag would publish files with the wrong version in their names.
      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" installers/* --generate-notes
