name: Feature request
description: Suggest something Open Spotify should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Search the existing issues first; if someone has already asked for this, add your use
        case to their issue. Open Spotify uses the Spotify Web API in development mode, so some
        features of the official app (recommendations, related artists, audio features) are not
        possible.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like Open Spotify to solve it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, or how you work around it now.
