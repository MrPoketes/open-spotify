appId: dev.openspotify.app
directories:
  output: release
# Only the compiled app is shipped. The renderer's server bundle (dist/server)
# exists solely to prerender the SPA shell at build time.
files:
  - out/**
  - dist/client/**
  - package.json
asar: true
artifactName: ${name}-${version}-${arch}.${ext}
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.music
  # Apple Silicon reports an unsigned app as "damaged" and offers no way to open
  # it. An ad-hoc signature needs no certificate and lets Gatekeeper's "Open
  # Anyway" work. Under an ad-hoc signature, hardened runtime's library
  # validation would refuse to load Electron's frameworks.
  identity: "-"
  hardenedRuntime: false
linux:
  target:
    - AppImage
    - deb
  icon: build/icons
  category: Audio
  maintainer: Armintas
