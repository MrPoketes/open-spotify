# Install scripts are blocked unless listed here. Electron has no install
# script: `pnpm dev` downloads its binary with `install-electron`, because
# electron-vite looks for the binary without downloading it. electron-winstaller
# is only needed for Squirrel installers, which we do not build.
allowBuilds:
  electron: false
  electron-winstaller: false

# pnpm holds back versions published very recently. These were adopted on
# release day; the entries can be removed once they age past the threshold.
minimumReleaseAgeExclude:
  - "@effect/platform-node-shared@4.1.5"
  - "@effect/platform-node@4.1.5"
  - "@effect/sql-sqlite-node@4.1.5"
  - effect@4.1.5
  - "@effect/vitest@4.1.5"
